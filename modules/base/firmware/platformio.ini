; PlatformIO Project Configuration - OLAF Base Module
;
; Module: Base (I2C Address: 0x0B)
; MCU: ESP32-S3-DevKitC-1 (N16R8)
; Hardware:
;   - BNO085 IMU (0x4A) on I2C0 GPIO 4/5 — 9-axis AHRS with on-chip sensor fusion
;   - SSD1306 OLED (0x3C) on I2C0 GPIO 4/5 (shared bus)
;   - ODrive Motor Controller (UART GPIO 38/39, J3 right header)
;   - 2x Hoverboard BLDC Motors
;
; Build: pio run
; Upload (OTA): pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 specific configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Serial
monitor_speed = 115200
upload_speed = 460800

; OTA upload
upload_protocol = espota
upload_port = olaf-base.local
upload_flags = --auth=olaf-base-ota-2024

; Dependencies
lib_deps =
    Wire
    WiFi
    ESPmDNS
    ArduinoOTA
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit BNO08x@^1.2.5
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.1

; Include shared libraries (OTA, Logger)
lib_extra_dirs = ../../shared/firmware

; Library Dependency Finder
lib_ldf_mode = deep+

; All .cpp/.h files in src/ are compiled automatically

; Build flags
build_flags =
    -D MODULE_NAME=\"BASE\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I ../../shared/firmware

    ; I2C0 - Master for BNO085 IMU + OLED (per wiring.md)
    -D I2C_SDA=4
    -D I2C_SCL=5
    -D BNO085_INT=6
    -D BNO085_RST=7

    ; ODrive UART — J3 right header for screw-terminal wiring
    -D ODRIVE_TX=39
    -D ODRIVE_RX=38
    -D ODRIVE_BAUD=115200

    ; I2C1 Slave (Pi communication) — J3 right header
    -D I2C1_SDA=21
    -D I2C1_SCL=47

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Serial upload (USB fallback when OTA unavailable)
[env:esp32s3-serial]
extends = env:esp32s3
upload_protocol = esptool
upload_port = /dev/ttyACM0
upload_speed = 460800
upload_flags =
