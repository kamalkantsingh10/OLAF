; PlatformIO Project Configuration File - Head+Ears Module
;
; Module: Head+Ears (I2C Address: 0x08)
; Hardware:
;   - 2× OLED Eyes (128×64, SPI)
;   - 2× Articulated Ears (2-DOF, Feetech servos, UART)
;   - Floor Projector Control:
;     • Power: GPIO → Optocoupler
;     • Focus: Linear servo (PWM/UART)
;   - RGBD Camera (USB to Pi, not managed by ESP32)
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build settings
monitor_speed = 115200
upload_speed = 921600

; Dependencies
lib_deps =
    Wire                                    ; I2C library (built-in)
    SPI                                     ; SPI library (built-in)
    adafruit/Adafruit GFX Library@^1.11.9   ; Graphics library for OLED
    adafruit/Adafruit SSD1306@^2.5.9        ; OLED display driver
    paulstoffregen/ServoEasing@^3.2.0       ; Smooth servo control
    bblanchon/ArduinoJson@^6.21.4           ; JSON parsing
    ESP32Servo                              ; ESP32 servo library

; Include shared libraries
lib_extra_dirs = ../../shared/firmware

; Build flags
build_flags =
    -D MODULE_NAME="HEAD_EARS"
    -D I2C_SLAVE_ADDRESS=0x08
    -D ENABLE_I2C_SLAVE
    -D ENABLE_OTA
    -D OLED_LEFT_CS=5
    -D OLED_LEFT_DC=17
    -D OLED_LEFT_RST=16
    -D OLED_RIGHT_CS=18
    -D OLED_RIGHT_DC=19
    -D OLED_RIGHT_RST=23
    -D PROJECTOR_POWER_PIN=25
    -D PROJECTOR_FOCUS_SERVO_PIN=26
    -D EAR_LEFT_SERVO_RX=32
    -D EAR_LEFT_SERVO_TX=33
    -D EAR_RIGHT_SERVO_RX=27
    -D EAR_RIGHT_SERVO_TX=14

; Partitions for OTA
board_build.partitions = min_spiffs.csv

; Upload settings
; Change upload_port to match your USB device
; Linux: /dev/ttyUSB0 or /dev/ttyACM0
; macOS: /dev/cu.usbserial-*
; Windows: COM3, COM4, etc.
; upload_port = /dev/ttyUSB0

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Development vs Production builds
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env:esp32dev.build_flags}
    -D DEBUG=1
    -D CORE_DEBUG_LEVEL=5

[env:esp32dev-release]
extends = env:esp32dev
build_type = release
build_flags =
    ${env:esp32dev.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -O2
