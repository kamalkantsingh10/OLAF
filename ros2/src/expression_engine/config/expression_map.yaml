# OLAF expression map — canonical-vocabulary → body render.
#
# Schema is architecture §5.2 (FROZEN by Story 6.4 — Epic 7 authors
# CONTENT against this structure; the structure itself does not change).
#
# Disambiguation is BY TOPIC, not by name: mood.happy and
# speech_emotion.happy are distinct keys with distinct renders
# (companion brief #4). Composition order (render loop, Story 6.3):
#   activity_base -> mood_bias -> speech_overlay -> active_vocalization
#
# Story 6.2 scope: STRUCTURAL skeleton with minimal-but-valid values
# for every canonical name so the startup completeness check passes.
# Real expressive authoring is Epic 7 (speech_emotion seeded from
# head_ears_driver/expressions.py).

# Engine map's own version — independent of the pipeline wire
# schema_version (which is 3, enforced by schema.py).
schema_version: 1

# Canonical vocabulary is validated against THIS companion release.
# MUST equal schema.PINNED_COMPANION_TAG — mismatch is startup-fatal
# (the NFR5 lockstep enforcement promised in Story 6.1 / §12.4).
pinned_companion_tag: "v3.0.0"

# FR13 runtime fallback, returned for any unmapped canonical name.
defaults:
  pose:
    neck: { pan: 0, tilt: 0, roll: 0 }
    ears: { left_pan: 0, left_tilt: 0, right_pan: 0, right_tilt: 0 }
  eye: { expression: neutral, intensity: 3 }
  led: { color: "#404040", intensity: 0.2, pattern: solid }
  heart: { bpm: 60, intensity: 2, color: "#802020" }

# ALL Mood values. Story 7.4 DE-SCOPE (2026-05-22): mood is NOT a head
# modifier — no neck lean (lean_bias removed), no eye recolour. Mood's
# emotional display is the HEART (Epic 8.1, via `led_bias.color`); on the
# head it only sets the WS2812 colour tint (`led_overlay`) during the lit
# states (listening/working/speaking), and (later) modulates idle drift
# (Story 6.5). `eye` is consumed ONLY by nod/shake vocalizations (Story
# 7.2 — they source their transient eye from the current mood; intensity
# is a [min,max] range sampled per fire). `led_overlay` = nearest of the
# 5 device tint buckets (none/warm/cool/hot/bright); `led_bias.color`
# keeps the true hex (heart / future RGB).
mood:
  calm:       { led_bias: { color: "#a0c0ff", intensity: 0.3 }, led_overlay: cool,   eye: { expression: content,   intensity: [1, 2] } }
  happy:      { led_bias: { color: "#ffd060", intensity: 0.5 }, led_overlay: warm,   eye: { expression: happy,     intensity: [2, 3] } }
  playful:    { led_bias: { color: "#ff90c0", intensity: 0.5 }, led_overlay: warm,   eye: { expression: excited,   intensity: [2, 3] } }
  curious:    { led_bias: { color: "#90e0ff", intensity: 0.4 }, led_overlay: cool,   eye: { expression: curious,   intensity: [2, 3] } }
  thoughtful: { led_bias: { color: "#b0b0ff", intensity: 0.3 }, led_overlay: cool,   eye: { expression: neutral,   intensity: [1, 2] } }
  sleepy:     { led_bias: { color: "#605080", intensity: 0.2 }, led_overlay: cool,   eye: { expression: sleepy,    intensity: [1, 2] } }
  grumpy:     { led_bias: { color: "#c06040", intensity: 0.3 }, led_overlay: hot,    eye: { expression: angry,     intensity: [1, 2] } }
  excited:    { led_bias: { color: "#ffb030", intensity: 0.6 }, led_overlay: bright, eye: { expression: excited,   intensity: [3, 4] } }

# ALL ActivityState values — one COMPLETE base posture each (Story 7.3).
# `working` is nested by submode (thinking | delegating). Each leaf
# carries a full neck (pan/tilt/roll) AND ears (left/right pan/tilt)
# block so "what OLAF is doing" reads from the body alone (AC#1/#2).
#
# This is the absolute ACTIVITY BASE layer; the render loop eases toward
# it and ADDS the (subtle) mood lean + (additive) speech_emotion bias on
# top (§5.1). Values sit within the hardened adapter clamps (neck
# pan±80 / tilt±20 / roll±15; ears pan±50 / tilt−60..90) AND keep
# right_pan ≤50 (SCS0009 binds ≥65 — project memory). ears: pan 0=up/+out;
# tilt +fwd/−back. eye.expression is a canonical name the AR10
# eye_adapter table resolves to a device EXPR (activity eyes reuse the
# existing device set — no new device eye authored this story).
#
# Posture vocabulary (bear convention, Story 7.3 Dev Notes):
#   sleeping/going_to_sleep = head dipped, ears drooped back;
#   waking = half-up from sleep; listening = neutral neck, ears
#   forward-perked (attentive); thinking = head turned LEFT + left ear
#   cocked (introspective, asymmetric); delegating = head turned RIGHT,
#   ears forward (outward-facing); speaking = head up, ears strongly
#   perked (animated/engaged).
activity:
  # BOOT = SLEEP MODE (Story 7.3, Kamal 2026-05-22): the bot boots
  # asleep and "wakes up from" this pose, so `starting` shares the
  # `sleeping` body (dropped head + drooped ears) + sleepy eye + IDLE
  # (dark) strip. Intentionally the same posture as `sleeping`.
  starting:       { pose: { neck: { pan: 0,   tilt: -28, roll: 0 },  ears: { left_pan: 25, left_tilt: -25, right_pan: 25, right_tilt: -7 } },  eye: { expression: boot,     intensity: 3 }, led: { pattern: boot_seq } }
  sleeping:       { pose: { neck: { pan: 0,   tilt: -28, roll: 0 },  ears: { left_pan: 25, left_tilt: -25, right_pan: 25, right_tilt: -7 } },  eye: { expression: closed,   intensity: 1 }, led: { pattern: breathe_slow } }
  waking:         { pose: { neck: { pan: 0,   tilt: -4,  roll: 0 },  ears: { left_pan: 22, left_tilt: -5,  right_pan: 22, right_tilt: -5 } },  eye: { expression: waking,   intensity: 2 }, led: { pattern: fade_in } }
  listening:      { pose: { neck: { pan: 0,   tilt: 2,   roll: 0 },  ears: { left_pan: 3,  left_tilt: 14,  right_pan: 3,  right_tilt: 14 } },  eye: { expression: curious,  intensity: 2 }, led: { pattern: ear_breathe } }
  working:
    thinking:     { pose: { neck: { pan: -8,  tilt: 4,   roll: -3 }, ears: { left_pan: 14, left_tilt: 18,  right_pan: 8,  right_tilt: 4 } },   eye: { expression: focused,  intensity: 3 }, led: { pattern: pulse_blue } }
    delegating:   { pose: { neck: { pan: 8,   tilt: 0,   roll: 3 },  ears: { left_pan: 10, left_tilt: 18,  right_pan: 12, right_tilt: 18 } },  eye: { expression: distant,  intensity: 3 }, led: { pattern: spinner } }
  # speaking authors NO eye — the eye is driven by whatever speech_emotion
  # is active (Story 7.3). Activity contributes only the body pose + the
  # SPEAKING system_status (LED); the eye defers to speech (neutral
  # default if nothing is speaking yet).
  speaking:       { pose: { neck: { pan: 0,   tilt: 4,   roll: 0 },  ears: { left_pan: 10, left_tilt: 24,  right_pan: 10, right_tilt: 24 } }, led: { pattern: warm_active } }
  going_to_sleep: { pose: { neck: { pan: 0,   tilt: -10, roll: 0 },  ears: { left_pan: 25, left_tilt: -12, right_pan: 25, right_tilt: -7 } },  eye: { expression: closing,  intensity: 1 }, led: { pattern: fade_out } }

# ALL 12 first-class speech-emotion names — overlay on the mood base.
# Each carries BOTH a neck bias and an ear pose.
# Story 7.1 FINALIZED. Each entry = the finalized UX spec
# (docs/planning-artifacts/ux-design-specification.md "The 12
# speech-emotion specs") **Pose ① (primary)** mapped into the FROZEN
# §5.2-Amendment single-pose shape. neck p/t/r = pan/tilt/roll;
# ears = left/right pan(0=up,+out) / tilt(+fwd,-back). eye.intensity
# = the spec's eye-glow level (1–5 catalogue). led_overlay = valence
# family token (not rendered until Story 6.6 LED adapter). The 3-pose
# A/B/C sets in the spec are NOT authored here (one pose per the
# frozen schema; poses ②/③ tracked separately). All values sit inside
# the hardened neck/ears adapter clamps (neck pan±80 tilt±20 roll±15;
# ears pan±50 tilt−60..90) so no clamp fires.
speech_emotion:
  neutral:     { pose: { neck: { pan: 0,  tilt: 0,   roll: 0 },  ears: { left_pan: 5,  left_tilt: 0,   right_pan: 5,  right_tilt: 0 } },   eye: { expression: neutral,     intensity: 3 }, led_overlay: none }
  content:     { pose: { neck: { pan: 0,  tilt: 6,   roll: 0 },  ears: { left_pan: 10, left_tilt: 8,   right_pan: 10, right_tilt: 8 } },   eye: { expression: content,     intensity: 3 }, led_overlay: warm }
  excited:     { pose: { neck: { pan: 0,  tilt: 18,  roll: 0 },  ears: { left_pan: 22, left_tilt: 18,  right_pan: 22, right_tilt: 18 } }, eye: { expression: excited,     intensity: 5 }, led_overlay: bright }
  sad:         { pose: { neck: { pan: 0,  tilt: -16, roll: 0 },  ears: { left_pan: 30, left_tilt: -10, right_pan: 30, right_tilt: -10 } }, eye: { expression: sad,         intensity: 2 }, led_overlay: cool }
  # ⚠ angry/frustrated/scared carry negative right_tilt; servo-ids.yaml
  # right_tilt physical min is -7 (adapter clamp is wider, -60). These
  # three are the hardware-tuning set for the Task 5 robot pass.
  angry:       { pose: { neck: { pan: 0,  tilt: -10, roll: 0 },  ears: { left_pan: 8,  left_tilt: -14, right_pan: 8,  right_tilt: -14 } }, eye: { expression: angry,       intensity: 4 }, led_overlay: hot }
  scared:      { pose: { neck: { pan: 0,  tilt: -6,  roll: 0 },  ears: { left_pan: 10, left_tilt: -20, right_pan: 10, right_tilt: -20 } }, eye: { expression: scared,      intensity: 3 }, led_overlay: cool }
  # Story 6.4 REFERENCE expression — KEPT AS-IS (do not churn). Ears
  # seeded verbatim from head_ears_driver/expressions.py EMOTION_HAPPY
  # (left_pan 20, left_tilt 18, right_pan 20, right_tilt 18;
  # right_pan ≤50 safe). neck bias is a modest joyful chin-up.
  # Proven end-to-end on hardware in Story 6.4 Task 5.
  happy:       { pose: { neck: { tilt: 6 },          ears: { left_pan: 20, left_tilt: 18, right_pan: 20, right_tilt: 18 } }, eye: { expression: happy,       intensity: 4 }, led_overlay: warm }
  curious:     { pose: { neck: { pan: 10, tilt: 6,   roll: 12 }, ears: { left_pan: 6,  left_tilt: 16,  right_pan: 30, right_tilt: 6 } },  eye: { expression: curious,     intensity: 4 }, led_overlay: none }
  sympathetic: { pose: { neck: { pan: 6,  tilt: 2,   roll: 10 }, ears: { left_pan: 12, left_tilt: 8,   right_pan: 12, right_tilt: 8 } },   eye: { expression: sympathetic, intensity: 3 }, led_overlay: warm }
  surprised:   { pose: { neck: { pan: 0,  tilt: 16,  roll: 0 },  ears: { left_pan: 28, left_tilt: 6,   right_pan: 28, right_tilt: 6 } },   eye: { expression: surprised,   intensity: 5 }, led_overlay: bright }
  frustrated:  { pose: { neck: { pan: 18, tilt: -4,  roll: -4 }, ears: { left_pan: 14, left_tilt: -6,  right_pan: 20, right_tilt: -10 } }, eye: { expression: frustrated,  intensity: 3 }, led_overlay: hot }
  melancholic: { pose: { neck: { pan: -8, tilt: -12, roll: -3 }, ears: { left_pan: 24, left_tilt: -6,  right_pan: 24, right_tilt: -6 } },  eye: { expression: melancholic, intensity: 1 }, led_overlay: cool }

# ALL vocalization tags. Story 7.2 authors `layered_action` for each:
# a CRISP transient (total window attack_ms+settle_ms ∈ [500, 1500]ms)
# that lands on the body ABOVE whatever speech_emotion / mood /
# activity is already running (AR12 additivity — base layer is
# preserved on neck+ears; eye overrides for the window then re-fires
# the composed eye on expiry via fire-on-change).
#
# All numeric params are 2-list RANGES `[min, max]` sampled per fire
# via the loop's injected `random.Random` — no two fires of the same
# vocalization look identical at the joint level. Single-scalar values
# are also accepted (fixed; map_loader normalises both shapes).
#
# Components (each optional except `attack_ms`+`settle_ms`+`eye`):
#   attack_ms     : range[int]  perceptual onset window
#   settle_ms     : range[int]  rest of the gesture window
#   eye           : { expression, intensity: range[int 1..5] }
#                   nod/shake OMIT `expression` — taken from
#                   mood.<current_mood>.eye.expression (else defaults)
#   neck_gesture  : { token, amp_deg: range[float], dur_s: range[float] }
#                   `token` ∈ adapters.neck_gestures.GESTURES
#                   (nod/dip/shake/tilt_left/tilt_right/look_away/peek)
#   ears_gesture  : { token, amp_deg: range[float], dur_s: range[float] }
#                   `token` ∈ adapters.ears_gestures.GESTURES
#                   (perk_up/droop/flatten/flick/twitch/swivel_in/
#                   swivel_out/one_cock)
#
# nod/shake are wire-back-compat with Story 6.3 (`visible_only: true`,
# silent gestures); the trajectory is now driven from THIS map rather
# than render_loop._Gesture.SHAPES (the old hard-coded table is gone).
# Companion v3.0.0 wire schema is UNCHANGED — `layered_action` is a
# pure consumer-side enrichment (Story 7.2 AC#1). LED dispatch on
# vocalization is OUT OF SCOPE — the REG_LED_OVERLAY register stays
# reserved for speech_emotion + mood (Story 6.6).
vocalization:
  # Review iter (2026-05-20): bigger amp + multi-cycle nod so the body
  # reads as the dominant feature (otherwise the eye dominates).
  laughter:
    visible_only: false
    layered_action:
      attack_ms: [60, 120]
      settle_ms: [440, 1380]
      eye:           { expression: happy,     intensity: [1, 3] }
      neck_gesture:  { token: nod,     amp_deg: [14, 20], dur_s: [0.7, 1.2], cycles: [2, 4] }
      ears_gesture:  { token: flick,   amp_deg: [10, 16], dur_s: [0.5, 0.9] }
  # Review iter #3 (2026-05-20): eye = neutral (oval-steady). Earlier
  # `content` was visibly indistinguishable from `happy` on the device
  # — firmware comments confirm both are "crescent-up" shapes; only
  # depth differs. `neutral` (oval-steady) is the cleanest visual
  # contrast for a sigh-back-to-baseline beat.
  sigh:
    visible_only: false
    layered_action:
      attack_ms: [120, 200]
      settle_ms: [380, 1300]
      eye:           { expression: neutral, intensity: [1, 3] }
      neck_gesture:  { token: dip,     amp_deg: [6, 10],  dur_s: [0.7, 1.4] }
      ears_gesture:  { token: droop,   amp_deg: [6, 10],  dur_s: [0.7, 1.3] }
  # Review iter #2: eye = sad at L1 (intensity 1, fixed). Gasp reads
  # as a quiet "oh no" rather than the noisy surprised/sympathetic
  # earlier drafts.
  gasp:
    visible_only: false
    layered_action:
      attack_ms: [40, 80]
      settle_ms: [460, 1420]
      eye:           { expression: sad, intensity: 1 }
      neck_gesture:  { token: peek,    amp_deg: [10, 16], dur_s: [0.5, 1.0] }
      ears_gesture:  { token: perk_up, amp_deg: [12, 18], dur_s: [0.5, 1.0] }
  # Review iter #2 (2026-05-20): NO eye override (the speech_emotion
  # eye shows through — clears_throat is throat-only, not emotional).
  # NO ears (literal-still). Neck = small sideways jerks (`shake` at
  # low amp).
  clears_throat:
    visible_only: false
    layered_action:
      attack_ms: [80, 150]
      settle_ms: [420, 1350]
      neck_gesture:  { token: shake,   amp_deg: [2, 5],   dur_s: [0.5, 0.9] }
  # Review iter #2: NO eye override on nod/shake — they're physical
  # responses (yes/no); the speaker's CURRENT eye (held speech_emotion)
  # is the right thing to keep visible while the head bobs. cycles is
  # still sampled int per fire — amp stays constant within one fire.
  nod:
    visible_only: true
    layered_action:
      attack_ms: [60, 120]
      settle_ms: [440, 1380]
      neck_gesture:  { token: nod,     amp_deg: [12, 18], dur_s: [0.5, 1.0], cycles: [1, 3] }
  shake:
    visible_only: true
    layered_action:
      attack_ms: [60, 120]
      settle_ms: [440, 1380]
      neck_gesture:  { token: shake,   amp_deg: [14, 20], dur_s: [0.5, 1.0] }
