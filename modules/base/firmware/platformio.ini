; PlatformIO Project Configuration File - Base Module
;
; Module: Base (I2C Address: 0x0B)
; Hardware:
;   - 2× Hoverboard BLDC Motors + ODrive (UART1)
;   - MPU6050 IMU (200Hz self-balancing PID)
;   - Servo Kickstand (Feetech STS3215, UART2)
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build settings
monitor_speed = 115200
upload_speed = 921600

; Dependencies
lib_deps =
    Wire                                    ; I2C library (built-in)
    adafruit/Adafruit MPU6050@^2.2.4        ; IMU library
    bblanchon/ArduinoJson@^6.21.4           ; JSON parsing
    paulstoffregen/ServoEasing@^3.2.0       ; Kickstand servo
    https://github.com/micro-ROS/micro_ros_arduino.git  ; micro-ROS (optional)

; Include shared libraries
lib_extra_dirs = ../../shared/firmware

; Build flags
build_flags =
    -D MODULE_NAME="BASE"
    -D I2C_SLAVE_ADDRESS=0x0B
    -D ENABLE_I2C_SLAVE
    -D ENABLE_OTA
    -D ENABLE_SELF_BALANCING
    -D ODRIVE_TX=16
    -D ODRIVE_RX=17
    -D ODRIVE_BAUD=115200
    -D KICKSTAND_SERVO_TX=18
    -D KICKSTAND_SERVO_RX=19
    -D IMU_SDA=21
    -D IMU_SCL=22
    -D PID_LOOP_HZ=200
    -D MOTOR_LEFT_AXIS=0
    -D MOTOR_RIGHT_AXIS=1

; Partitions for OTA
board_build.partitions = min_spiffs.csv

; Upload settings
; upload_port = /dev/ttyUSB0

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Development vs Production builds
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env:esp32dev.build_flags}
    -D DEBUG=1
    -D CORE_DEBUG_LEVEL=5

[env:esp32dev-release]
extends = env:esp32dev
build_type = release
build_flags =
    ${env:esp32dev.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -O2
