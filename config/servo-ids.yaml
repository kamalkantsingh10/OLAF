# OLAF Servo ID Assignments
# Central configuration for all Feetech servo IDs across modules.
# All servos use Waveshare Bus Servo Adapter (A) in USB mode.
#
# Protocol: SCS series use scscl (protocol_end=1), STS series use sms_sts
# Baud rate: 1000000 (1Mbps) for all servos

ears:
  port: /dev/waveshare_ears
  baudrate: 1000000
  protocol: scscl  # SCS0009 uses SCS protocol
  counts_per_degree: 3.41  # SCS0009: 1024 counts / 300 degree range
  base_speed: 300  # Default servo speed (expressions adjust ±30%)
  servos:
    left_pan:
      id: 4
      model: SCS0009
      function: "Left ear base rotation"
      center_position: 679  # Raw position: ear straight up, fin parallel to eyeline
      min_angle: 0    # Center position (degrees)
      max_angle: 90   # Max outward rotation CW (degrees)
      direction: 1    # 1 = increasing counts = outward for left ear
    left_tilt:
      id: 5
      model: SCS0009
      function: "Left ear angle"
      center_position: 76
      min_angle: -90   # Backward tilt (degrees)
      max_angle: 110   # Forward tilt (degrees)
      direction: -1    # -1 = decreasing counts = forward tilt (mirror of right)
    right_pan:
      id: 6
      model: SCS0009
      function: "Right ear base rotation"
      center_position: 241
      min_angle: 0     # Center position (degrees)
      max_angle: 90    # Max outward rotation CCW (degrees)
      direction: -1    # -1 = decreasing counts = outward for right ear
    right_tilt:
      id: 7
      model: SCS0009
      function: "Right ear angle"
      center_position: 27
      min_angle: -90   # Backward tilt (degrees)
      max_angle: 110   # Forward tilt (degrees)
      direction: 1     # 1 = increasing counts = forward tilt

neck:
  port: /dev/waveshare_neck
  baudrate: 1000000
  protocol: sms_sts  # STS3215 uses STS protocol
  servos:
    pan:
      id: 1
      model: STS3215
      function: "Neck pan (left/right)"
    tilt:
      id: 2
      model: STS3215
      function: "Neck tilt (up/down)"
    roll:
      id: 3
      model: STS3215
      function: "Neck roll (head tilt)"
