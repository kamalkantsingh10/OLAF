; PlatformIO Project Configuration File - Base Module
;
; Module: Base (I2C Address: 0x0B)
; MCU: Keyestudio ESP32 PLUS (ESP32-WROOM-32)
; Hardware:
;   - MPU-9265 IMU (200Hz self-balancing)
;   - WS2812B LED Strip (status indicator)
;   - ODrive Motor Controller (UART)
;   - 2× Hoverboard BLDC Motors
;
; I2C Configuration:
;   - I2C0 (Wire):  Master for IMU         - SDA=21, SCL=22 (board I2C header)
;   - I2C1 (Wire1): Slave for Raspberry Pi - TBD (need different pins)
;
; Build: pio run
; Upload (serial): pio run -e esp32-serial -t upload
; Upload (OTA):    pio run -t upload
; Monitor: pio device monitor
; UDP Logs: nc -lu 514

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Build settings
board_build.f_cpu = 240000000L
board_build.partitions = min_spiffs.csv  ; OTA: Two app partitions + small SPIFFS
monitor_speed = 115200
upload_speed = 460800

; Dependencies
lib_deps =
    Wire                                    ; I2C library (built-in)
    WiFi                                    ; WiFi library (built-in, for OTA/Logger)
    ESPmDNS                                 ; mDNS library (built-in, for OTA)
    ArduinoOTA                              ; OTA library (built-in)
    fastled/FastLED@^3.6.0                  ; WS2812B LED strip

; Include shared libraries (OTA, Logger)
lib_extra_dirs = ../../shared/firmware

; Library Dependency Finder - deep+ mode ensures framework libraries are found
lib_ldf_mode = deep+

; Source files
build_src_filter =
    +<main.cpp>
    +<imu.cpp>
    +<imu.h>

; Build flags
build_flags =
    -D MODULE_NAME=\"BASE\"
    -D I2C_SLAVE_ADDRESS=0x0B
    -I ../../shared/firmware              ; Include shared secrets.h

    ; I2C0 - Master for IMU (board I2C header)
    -D IMU_SDA=21
    -D IMU_SCL=22

    ; I2C1 - Slave for Raspberry Pi (manual wiring)
    -D PI_SDA=21
    -D PI_SCL=22

    ; WS2812B LED Strip
    -D LED_DATA_PIN=13
    -D LED_COUNT=8

    ; ODrive UART
    -D ODRIVE_TX=17
    -D ODRIVE_RX=16
    -D ODRIVE_BAUD=115200

; OTA configuration (after first flash)
;upload_protocol = espota
;upload_port = olaf-base.local
;upload_flags = --auth=olaf-base-ota-2024

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Debug build
[env:esp32-debug]
extends = env:esp32
build_type = debug
build_flags =
    ${env:esp32.build_flags}
    -D DEBUG=1

; Serial upload environment (for first flash)
[env:esp32-serial]
extends = env:esp32
upload_protocol = esptool
upload_port = /dev/ttyUSB0
