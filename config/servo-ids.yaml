# OLAF Servo ID Assignments
# Central configuration for all Feetech servo IDs across modules.
# All servos use Waveshare Bus Servo Adapter (A) in USB mode.
#
# Protocol: SCS series use scscl (protocol_end=1), STS series use sms_sts
# Baud rate: 1000000 (1Mbps) for all servos

ears:
  port: /dev/waveshare_ears
  baudrate: 1000000
  protocol: scscl  # SCS0009 uses SCS protocol
  counts_per_degree: 3.41  # SCS0009: 1024 counts / 300 degree range
  base_speed: 300  # Default servo speed (expressions adjust ±30%)
  servos:
    left_pan:
      id: 4
      model: SCS0009
      function: "Left ear base rotation"
      center_position: 679  # Raw position: ear straight up, fin parallel to eyeline
      min_angle: 0    # Center position (degrees)
      max_angle: 90   # Max outward rotation CW (degrees)
      direction: 1    # 1 = increasing counts = outward for left ear
    left_tilt:
      id: 5
      model: SCS0009
      function: "Left ear angle"
      center_position: 76
      min_angle: -90   # Backward tilt (degrees) — plenty of range
      max_angle: 20    # Forward tilt limited — center near raw 0
      direction: -1    # -1 = decreasing counts = forward tilt (mirror of right)
    right_pan:
      id: 6
      model: SCS0009
      function: "Right ear base rotation"
      center_position: 241
      min_angle: 0     # Center position (degrees)
      max_angle: 70    # Max outward — limited by center at raw 241
      direction: -1    # -1 = decreasing counts = outward for right ear
    right_tilt:
      id: 7
      model: SCS0009
      function: "Right ear angle"
      center_position: 27
      min_angle: -7    # Backward tilt limited — center near raw 0
      max_angle: 110   # Forward tilt (degrees) — plenty of range
      direction: 1     # 1 = increasing counts = forward tilt

neck:
  port: /dev/waveshare_neck
  baudrate: 1000000
  protocol: sms_sts  # STS3215 uses STS protocol
  counts_per_degree: 11.38  # STS3215: 4096 counts / 360 degree range
  base_speed: 500  # Default servo speed (steps/sec)
  base_acc: 50  # Default acceleration (0-254, higher = smoother ramp)
  # Parallel linkage neck: base pan servo + universal joint with two linkage servos
  # Tilt forward/back = both linkages push same direction
  # Roll left/right = linkages push opposite directions (differential)
  servos:
    pan:
      id: 11
      model: STS3215
      function: "Neck base rotation (pan left/right)"
      center_position: 2164  # Recalibrated 2026-05-17: head physically leveled (Story 5.3 follow-up)
      min_angle: -90
      max_angle: 90
      direction: -1  # +counts = OLAF's right, positive angle = OLAF's left
    left_linkage:
      id: 12
      model: STS3215
      function: "Left linkage servo (tilt/roll via universal joint)"
      center_position: 3096  # Recalibrated 2026-05-17: head physically leveled (Story 5.3 follow-up)
      min_angle: -28  # Story 7.3: raised ±20→±28 (Kamal-confirmed linkage reaches 28° tilt safely)
      max_angle: 28
      direction: 1    # +counts = chin up (tilt up)
    right_linkage:
      id: 13
      model: STS3215
      function: "Right linkage servo (tilt/roll via universal joint)"
      center_position: 370  # Recalibrated 2026-05-17: head physically leveled (Story 5.3 follow-up)
      min_angle: -28  # Story 7.3: raised ±20→±28 (Kamal-confirmed linkage reaches 28° tilt safely)
      max_angle: 28
      direction: -1   # +counts = chin down; for tilt up, needs negative movement
