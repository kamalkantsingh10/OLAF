; PlatformIO Project Configuration File - Neck Module
;
; Module: Neck (I2C Address: 0x09)
; Hardware:
;   - 3-DOF Servo Array (pan/tilt/roll, Feetech STS3215, UART)
;   - 2× Presence Sensors (360° human detection)
;   - Smooth organic motion curves
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build settings
monitor_speed = 115200
upload_speed = 921600

; Dependencies
lib_deps =
    Wire                                    ; I2C library (built-in)
    paulstoffregen/ServoEasing@^3.2.0       ; Smooth servo control
    bblanchon/ArduinoJson@^6.21.4           ; JSON parsing
    adafruit/Adafruit VCNL4040@^1.0.4       ; Proximity sensor (if using VCNL4040)

; Include shared libraries
lib_extra_dirs = ../../shared/firmware

; Build flags
build_flags =
    -D MODULE_NAME="NECK"
    -D I2C_SLAVE_ADDRESS=0x09
    -D ENABLE_I2C_SLAVE
    -D ENABLE_OTA
    -D SERVO_PAN_RX=16
    -D SERVO_PAN_TX=17
    -D SERVO_TILT_RX=18
    -D SERVO_TILT_TX=19
    -D SERVO_ROLL_RX=21
    -D SERVO_ROLL_TX=22
    -D PRESENCE_SENSOR_1_SDA=25
    -D PRESENCE_SENSOR_1_SCL=26
    -D PRESENCE_SENSOR_2_SDA=32
    -D PRESENCE_SENSOR_2_SCL=33

; Partitions for OTA
board_build.partitions = min_spiffs.csv

; Upload settings
; upload_port = /dev/ttyUSB0

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Development vs Production builds
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env:esp32dev.build_flags}
    -D DEBUG=1
    -D CORE_DEBUG_LEVEL=5

[env:esp32dev-release]
extends = env:esp32dev
build_type = release
build_flags =
    ${env:esp32dev.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -O2
