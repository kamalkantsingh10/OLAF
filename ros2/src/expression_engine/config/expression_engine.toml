# OLAF Expression Engine configuration.
#
# Mirrors companion brief Appendix B.1 / architecture §8
# (docs/planning-artifacts/architecture/phase2-expression-engine.md#8).
#
# `schema_version` here is the *config-file* schema version (local to
# this engine). It is NOT the wire `schema_version` (that is always 3,
# enforced by expression_engine/schema.py — see companion Appendix A.3).
schema_version = 1

# Story 6.1 consumes only [dds] and [topics]. The remaining sections
# are the canonical §8 shape; their consumers land in later Epic 6/7/8
# stories. The loader (expression_engine/config.py) ignores unknown /
# not-yet-consumed sections so this file does not churn per story.

[dds]
# OLAF DDS domain (0..232). Configurable on both sides; the producer's
# publisher uses [publisher].dds_domain_id (Appendix A.1) and MUST match
# this — mismatch = body hears nothing while looking alive.
domain_id = 42

[topics]
# Topic names MUST match the producer's [publisher.topics] block (see
# contract/INTERFACE.md). Subscribe-only — the engine never publishes.
#
# Story 7.6: these may instead be RELATIVE names (no leading slash,
# e.g. "expression/mood"); the node namespace then scopes them per
# robot — run with `--ros-args -r __ns:=/olaf_2` — so multiple bodies
# coexist on one DDS graph. The absolute /olaf/* names below are the
# default (backward-compatible with the current companion).
mood = "/olaf/mood"
activity = "/olaf/activity"
speech_emotion = "/olaf/speech_emotion"
vocalization = "/olaf/vocalization"

# ── Sections below are not consumed in Story 6.1 (later stories) ──

[hardware]
# Cross-checked against config/servo-ids.yaml (Phase 1 calibration is
# the single source of truth — the engine does not duplicate it).
neck_port = "/dev/ttyUSB-neck"
ears_port = "/dev/ttyUSB-ears"
head_i2c_addr = 0x08
led_strip_count = 24
led_strip_pin = 18
heart_display = "spi-0.0"

[animation]
servo_tick_hz = 100
led_tick_hz = 30
mood_ease_seconds = 3.0
emotion_anticipatory_ms = 50
gesture_attack_ms = 80
gesture_settle_ms = 200
# Head "suddenness" — smooth_damp time-constants (s). Lower = snappier,
# less WALL-E. Defaults (absent) are 0.5 / 0.15; tuned down here so pose
# changes land crisply. Floor is 0.02 (~60ms arrival, snappy not a jerk).
activity_ease_seconds = 0.22   # activity pose transitions (was 0.5)
speech_ease_seconds   = 0.08   # speech_emotion pose snap (was 0.15)

[idle]
# Drift-to-sleep decay (Story 6.5). Left alone (not speaking/working),
# the whole head winds down to deep sleep along a fixed expression path
# at a random per-step pace, then loops at sleep so it's never
# statue-still. Most idle tuning lives here (no code change to retune).
idle_after_seconds = 60.0      # quiet time before decay starts (listening etc.)
step_min_seconds = 10.0        # random per-step pace, min
step_max_seconds = 30.0        # random per-step pace, max
ease_seconds = 2.0             # gentle per-step transition (dreamy, not a sudden jerk)
drift_amplitude_deg = 0.6      # sub-degree mood-modulated micro-movement
drift_period_seconds = 4.0     # breath-like micro-movement period

[listening]
# Head motion while the activity is `listening` (Story 7.6). A side-to-
# side cock (ROLL) PLUS sharp pan/tilt darts so OLAF reads as alert and
# reactive, not slow-WALL-E. Each swing samples random amplitude, ease
# (speed) and period so it never looks mechanical; darts re-sample on the
# same swing and ease in fast. Neck-only — no ears. Set roll_amp_*=0 to
# kill the cock, pan/tilt_amp_*=0 to kill the darts.
# Tuned STRONG/theatrical (Kamal 2026-06-02): bigger + faster + snappier.
roll_amp_min_deg = 6.0     # smallest cock (deg)
roll_amp_max_deg = 14.0    # largest cock (deg; roll clamp is ±15, 1° headroom)
roll_period_min_s = 1.5    # min seconds before swinging to the other side
roll_period_max_s = 5.0    # max seconds before swinging
roll_ease_min_s = 0.25     # fastest swing (sudden)
roll_ease_max_s = 1.2      # slowest swing
pan_amp_min_deg = 2.0      # sharp sideways dart, min (0 disables darts)
pan_amp_max_deg = 8.0      # sharp sideways dart, max
tilt_amp_min_deg = 1.5     # sharp up/down dart, min
tilt_amp_max_deg = 6.0     # sharp up/down dart, max

[speaking]
# Procedural "talking motion" while the activity is `speaking` (Story
# 7.6) so OLAF doesn't look frozen mid-reply: random neck nods (tilt) +
# glances (pan) + ear perk-twitches, re-sampled each move. Procedural,
# NOT audio-synced. The amplitude AND pace are scaled at render time by
# the active speech_emotion's energy (excited swings big/fast, sad
# small/slow — render_loop._speech_energy). Set all *_amp_max_deg to 0
# to disable. Tuned STRONG (Kamal 2026-06-02) — bigger + livelier base.
tilt_amp_min_deg = 2.5     # smallest nod (neck tilt) — ×energy at render
tilt_amp_max_deg = 7.0     # largest nod
pan_amp_min_deg = 2.0      # smallest glance (neck pan)
pan_amp_max_deg = 6.0      # largest glance
ear_amp_min_deg = 2.0      # smallest ear perk-twitch (TILT — perk fwd / droop back)
ear_amp_max_deg = 6.0      # largest ear perk-twitch
ear_pan_amp_min_deg = 1.5  # smallest ear SWIVEL (pan — turn out/in); 0 disables swivel
ear_pan_amp_max_deg = 4.0  # largest ear swivel
ear_accent_chance = 0.30   # P(single-ear asymmetric accent) — 0 = always symmetric
period_min_s = 0.6         # min seconds between moves (÷energy → livelier)
period_max_s = 1.8         # max seconds between moves
ease_min_s = 0.2           # fastest move (sudden)
ease_max_s = 0.6           # slowest move
