; PlatformIO Project Configuration File - Torso Module (LCD Test)
;
; Module: Torso (I2C Address: 0x0A)
; Hardware: ILI9341 2.8" TFT Display (320x240)
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial settings
monitor_speed = 115200
upload_speed = 921600

; Dependencies
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; Build flags
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=47
    -D TFT_DC=21
    -D TFT_RST=2
    -D TFT_BL=42
    -D TFT_MISO=-1
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
