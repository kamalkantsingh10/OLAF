; PlatformIO Project Configuration File - Neck Module
;
; Module: Neck (I2C Address: 0x09)
; MCU: ESP32-S3-DevKitC-1 (N16R8 - 16MB Flash, 8MB PSRAM)
; Hardware:
;   - 4× Feetech STS3215 Servos (3 neck + 1 kickstand, via Serial Bus Controller)
;   - 1× HLK-LD2461 mmWave Sensor (front, 2T4R, 5-target tracking, UART @ 256000)
;   - 8× WS2812B LED Status Strip
;   - I2C Slave interface to Raspberry Pi
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
framework = arduino

; Build settings
monitor_speed = 115200
upload_speed = 921600

; Dependencies
lib_deps =
    Wire                                    ; I2C library (built-in)
    fastled/FastLED@^3.6.0                  ; WS2812B LED control
    bblanchon/ArduinoJson@^6.21.4           ; JSON parsing
    rbegamer/HLK-LD2450@^1.0.2              ; HLK-LD2450 mmWave multi-target tracker
    ftservo/FTServo@^2.0.0                  ; FEETECH BUS Servo (STS3215, official library)

; Include shared libraries (if available)
lib_extra_dirs = ../../shared/firmware

; Build flags
build_flags =
    -D MODULE_NAME="NECK"
    -D I2C_SLAVE_ADDRESS=0x09
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3

    ; I2C Slave (to Raspberry Pi)
    -D I2C_SDA=8
    -D I2C_SCL=9

    ; UART to Serial Bus Servo Controller
    -D SERVO_TX=17
    -D SERVO_RX=18
    -D SERVO_BAUD=115200

    ; WS2812B LED Strip
    -D LED_DATA_PIN=1
    -D LED_COUNT=8
    -D LED_TYPE=WS2812B
    -D LED_COLOR_ORDER=GRB

    ; mmWave Presence Sensor (UART2) - HLK-LD2450
    -D MMWAVE_TX=38
    -D MMWAVE_RX=39
    -D MMWAVE_BAUD=256000

    ; Onboard Status LED
    -D ONBOARD_LED=48

    ; Feature flags
    -D ENABLE_I2C_SLAVE
    -D ENABLE_OTA
    -D ENABLE_WS2812
    -D ENABLE_MMWAVE_SENSOR

; Partitions for OTA
board_build.partitions = min_spiffs.csv

; Upload settings
; upload_port = /dev/ttyUSB0

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Development vs Production builds
[env:esp32s3-debug]
extends = env:esp32s3
build_type = debug
build_flags =
    ${env:esp32s3.build_flags}
    -D DEBUG=1
    -D CORE_DEBUG_LEVEL=5

[env:esp32s3-release]
extends = env:esp32s3
build_type = release
build_flags =
    ${env:esp32s3.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -O2
