; PlatformIO Project Configuration for OLAF Head Module
; ESP32-S3-DevKitC-1 (N16R8) - Dual GC9A01 Eye Displays + I2C Slave
; Story 1.3: Develop Head ESP32 Firmware

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 specific configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv  ; OTA: Two 6.5MB app partitions

; Serial Monitor
monitor_speed = 115200
upload_speed = 460800

; Library dependencies
lib_deps =
    Wire                                    ; I2C library (built-in)
    WiFi                                    ; WiFi library (built-in, for OTA)
    ESPmDNS                                 ; mDNS library (built-in, for OTA)
    ArduinoOTA                              ; OTA library (built-in)
    bodmer/TFT_eSPI@^2.5.43                 ; GC9A01 display driver

; Include shared libraries (OTA, Logger)
lib_extra_dirs = ../../shared/firmware

; Library Dependency Finder
lib_ldf_mode = deep+

; Build flags
build_flags =
    -D MODULE_NAME="HEAD"
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -I ../../shared/firmware
    ; TFT_eSPI Configuration (per wiring-guide.md)
    ; Display GPIOs grouped on RIGHT side: GPIO38-41 (pins 8-11), GPIO1-2 (pins 13-14)
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=39
    -D TFT_SCLK=38
    -D TFT_CS=2
    -D TFT_DC=40
    -D TFT_RST=41
    -D TFT_BL=-1
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; Firmware version
    -D FIRMWARE_VERSION_STR=\"1.0.0\"

; Upload: Serial (first time) or OTA (after first flash)
; upload_port = /dev/ttyACM0  ; USB serial for first flash

; OTA enabled
upload_protocol = espota
upload_port = olaf-head.local
upload_flags = --auth=olaf-head-ota-2024

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Development build with debug
[env:esp32s3-debug]
extends = env:esp32s3
build_type = debug
build_flags =
    ${env:esp32s3.build_flags}
    -D DEBUG=1
