; PlatformIO Project Configuration File - Torso Module
;
; Module: Torso (I2C Address: 0x0A)
; Hardware:
;   - 2.8" Square Display (animated beating heart, SPI)
;   - Thermal Printer (lists, reminders, recipes)
;   - Raspberry Pi Housing, Battery Pack, LED indicators
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build settings
monitor_speed = 115200
upload_speed = 921600

; Dependencies
lib_deps =
    Wire                                    ; I2C library (built-in)
    SPI                                     ; SPI library (built-in)
    adafruit/Adafruit GFX Library@^1.11.9   ; Graphics library
    adafruit/Adafruit ST7789@^1.10.3        ; 2.8" display driver (adjust if different)
    adafruit/Adafruit Thermal Printer Library@^1.4.1  ; Thermal printer
    bblanchon/ArduinoJson@^6.21.4           ; JSON parsing

; Include shared libraries
lib_extra_dirs = ../../shared/firmware

; Build flags
build_flags =
    -D MODULE_NAME="TORSO"
    -D I2C_SLAVE_ADDRESS=0x0A
    -D ENABLE_I2C_SLAVE
    -D ENABLE_OTA
    -D DISPLAY_CS=5
    -D DISPLAY_DC=17
    -D DISPLAY_RST=16
    -D DISPLAY_WIDTH=240
    -D DISPLAY_HEIGHT=280
    -D PRINTER_TX=18
    -D PRINTER_RX=19
    -D LED_STATUS=25
    -D LED_BATTERY=26

; Partitions for OTA
board_build.partitions = min_spiffs.csv

; Upload settings
; upload_port = /dev/ttyUSB0

; Monitor settings
monitor_filters =
    esp32_exception_decoder
    time
    colorize

; Development vs Production builds
[env:esp32dev-debug]
extends = env:esp32dev
build_type = debug
build_flags =
    ${env:esp32dev.build_flags}
    -D DEBUG=1
    -D CORE_DEBUG_LEVEL=5

[env:esp32dev-release]
extends = env:esp32dev
build_type = release
build_flags =
    ${env:esp32dev.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -O2
